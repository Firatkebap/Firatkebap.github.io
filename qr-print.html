<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalıcı QR · Fırat Kebap</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .card {
        padding: 2rem 1.2rem;
      }
      img {
        width: min(320px, 80vw);
        height: auto;
        background: #fff;
        padding: 12px;
        border-radius: 12px;
      }
      p {
        color: #aaa;
        max-width: 28rem;
        margin: 1rem auto;
      }
      button {
        appearance: none;
        border: 1px solid #fff;
        background: #fff;
        color: #000;
        border-radius: 999px;
        padding: 0.7rem 1.3rem;
        font: inherit;
        cursor: pointer;
      }
      @media print {
        button, .hint { display: none; }
        body { background: #fff; color: #000; }
        p { color: #000; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Fırat Kebap</h1>
      <img src="qr.png" alt="Menü QR kodu" />
      <p>https://firatkebap.github.io/</p>
      <p class="hint">Bu sayfayı yazdırıp masaya yapıştırın. Kod değişmez; menü içeriği admin’den güncellenir.</p>
      <button type="button" onclick="print()">Yazdır</button>
    </div>
  </body>
</html>
